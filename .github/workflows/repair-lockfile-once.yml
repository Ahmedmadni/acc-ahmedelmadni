# Temporary, branch-scoped workflow used to generate the npm lockfile with npm itself.
# This file will be removed before the final pull request is ready.
name: Temporary npm lockfile regeneration
on:
  push:
    branches:
      - fix/ci-lockfile-cma-ifrs-20261109
    paths:
      - .github/workflows/repair-lockfile-once.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Rebuild npm lockfile without executing dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the regenerated npm lockfile to this feature branch
        shell: bash
        run: |
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(deps): synchronize npm lockfile with package.json"
            git push origin HEAD:fix/ci-lockfile-cma-ifrs-20261109
          fi
