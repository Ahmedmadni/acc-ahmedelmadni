name: IFRS content validation

on:
  pull_request:
    paths:
      - "src/data/ifrs-*"
      - "src/components/library/Ifrs*"
      - "src/routes/library.standards*"
      - "scripts/check-ifrs-*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ifrs-content.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run ifrs:check-content
      - run: npx tsc --noEmit
      - run: npm run build
