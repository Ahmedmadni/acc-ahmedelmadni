name: Accounting content and build validation

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "docs/ifrs-book2-audit-progress.md"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/ifrs-content.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/ifrs-content.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Clean npm install from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: IFRS content integrity
        run: npm run ifrs:check-content
      - name: IFRS source catalogue, permission-aware importer and examples
        run: |
          node scripts/check-ifrs-external-resources.mjs
          node --test scripts/tests/ifrsquiz-import.test.mjs
      - name: Original IFRS bilingual exam-practice batch
        run: node scripts/check-ifrs-original-practice.mjs
      - name: English-first CMA and IFRS library language regression
        run: node --test scripts/tests/library-study-language.test.mjs
      - name: Offline CMA/IFRS side notebook, paper and handwriting regression
        run: node --test scripts/tests/study-notebook.test.mjs
      - name: CMA content integrity
        run: npm run cma:check-content
      - name: CMA translation validation
        run: node --test scripts/tests/cma-translation.test.mjs
      - name: CMA Unit 14 source review and release hold inventory
        run: node --test scripts/tests/cma-unit14-review.test.mjs
      - name: CMA Unit 15 variance analysis Arabic release tests
        run: node --test scripts/tests/cma-unit15-arabic-wave1.test.mjs
      - name: CMA Unit 15 flexible budgets Arabic wave 2 release tests
        run: node --test scripts/tests/cma-unit15-arabic-wave2.test.mjs
      - name: CMA Unit 15 flexible budgeting wave 3 and source review regression
        run: node --test scripts/tests/cma-unit15-arabic-wave3.test.mjs
      - name: CMA Unit 15 wave 4 Arabic flexible-budget numerical release checks
        run: node --test scripts/tests/cma-unit15-arabic-wave4.test.mjs
      - name: CMA Unit 15 wave 5 direct material variance Arabic checks
        run: node --test scripts/tests/cma-unit15-arabic-wave5.test.mjs
      - name: CMA Unit 15 wave 6 direct material accounting and Arabic source checks
        run: node --test scripts/tests/cma-unit15-arabic-wave6.test.mjs
      - name: CMA Unit 15 wave 7 direct material arithmetic and source holds
        run: node --test scripts/tests/cma-unit15-arabic-wave7.test.mjs
      - name: CMA Unit 15 wave 8 direct labor variance Arabic source and calculations
        run: node --test scripts/tests/cma-unit15-arabic-wave8.test.mjs
      - name: CMA Unit 15 wave 9 completed direct labor and mix-yield Arabic release checks
        run: node --test scripts/tests/cma-unit15-arabic-wave9.test.mjs
      - name: CMA Unit 16 responsibility accounting Arabic source checks
        run: node --test scripts/tests/cma-unit16-arabic-wave1.test.mjs
      - name: Test CMA Unit 17 Arabic drafts
        run: node --test scripts/tests/cma-unit17-arabic-wave1.test.mjs
      - name: Test CMA Unit 18 Arabic drafts
        run: node --test scripts/tests/cma-unit18-arabic-wave1.test.mjs
      - name: Test CMA Unit 19 Arabic drafts
        run: node --test scripts/tests/cma-unit19-arabic-wave1.test.mjs
      - name: Test CMA Unit 20 Arabic drafts
        run: node --test scripts/tests/cma-unit20-arabic-wave1.test.mjs
      - name: Audit CMA Part 1 bilingual source coverage
        run: node scripts/audit-cma-source-coverage.mjs
      - name: CMA browser-only translation and external fallback tests
        run: node --test scripts/tests/cma-translation-browser.test.mjs
      - name: CMA on-site Part 2 bank regression tests
        run: node --test scripts/tests/cma-online-bank.test.mjs
      - name: Part 2 intake audit self-test
        run: node scripts/audit-cma-part2-intake.mjs --self-test
      - name: Public CV download contract
        run: npm run cv:check
      - name: Portfolio operations and navigation contracts
        run: npm run portfolio:check
      - name: Production build (also regenerates TanStack routes)
        run: npm run build
      - name: TypeScript type checking
        run: npx tsc --noEmit
      # Pre-existing repository-wide formatting debt is tracked separately. Keep
      # all non-format ESLint rules blocking while avoiding a mass reformat diff.
      - name: ESLint code-quality rules
        run: |
          npx eslint . --rule 'prettier/prettier: off'
