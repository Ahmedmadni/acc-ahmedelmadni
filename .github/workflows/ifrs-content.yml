name: Accounting content and build validation

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "docs/ifrs-book2-audit-progress.md"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/ifrs-content.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/ifrs-content.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Clean npm install from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: IFRS content integrity
        run: npm run ifrs:check-content
      - name: CMA content integrity
        run: npm run cma:check-content
      - name: CMA translation validation
        run: node --test scripts/tests/cma-translation.test.mjs
      - name: Production build (also regenerates TanStack routes)
        run: npm run build
      - name: TypeScript type checking
        run: npx tsc --noEmit
      # Pre-existing repository-wide formatting debt is tracked separately. Keep
      # all non-format ESLint rules blocking while avoiding a mass reformat diff.
      - name: ESLint code-quality rules
        run: |
          npx eslint . --rule 'prettier/prettier: off'
