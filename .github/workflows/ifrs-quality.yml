name: IFRS Quality

on:
  pull_request:
    paths:
      - "src/data/ifrs-*.ts"
      - "src/components/library/Ifrs*.tsx"
      - "src/routes/library.standards.tsx"
      - "scripts/check-ifrs-question-coverage.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ifrs-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify IFRS content coverage
        run: npm run ifrs:check-coverage

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
