name: IFRS Quality

on:
  pull_request:
    paths:
      - "src/data/ifrs-*.ts"
      - "src/components/library/Ifrs*.tsx"
      - "src/routes/library.standards.tsx"
      - "scripts/check-ifrs-question-coverage.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ifrs-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify IFRS content coverage
        run: bun run ifrs:check-coverage

      - name: Build and generate route tree
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint
