# One-time generator; removed immediately after committing its generated result.
name: One-time route manifest refresh for browser-only CMA translation
on:
  push:
    branches:
      - feat/cma-translation-without-db-or-lovable-ai
    paths:
      - ".github/workflows/generate-route-tree-once.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Commit generated router file to feature branch only
        shell: bash
        run: |
          git add -- src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(router): remove unused paid CMA translation endpoint"
            git fetch origin feat/cma-translation-without-db-or-lovable-ai
            git rebase origin/feat/cma-translation-without-db-or-lovable-ai
            git push origin HEAD:feat/cma-translation-without-db-or-lovable-ai
          fi
